services:
  sfu:
    image: livekit/livekit-server:v1.9.12
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 17881
          udp_port: 17882
          use_external_ip: false
          node_ip: ${MEDIA_PUBLIC_IP:?Run npm run setup:media}
        keys:
          ${LIVEKIT_API_KEY:?Run npm run setup:media}: ${LIVEKIT_API_SECRET:?Run npm run setup:media}
        room:
          max_participants: 0
        logging:
          level: warn
    ports:
      - "127.0.0.1:17880:7880"
      - "17881:17881"
      - "17882:17882/udp"
    restart: unless-stopped
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: noctis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d noctis"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
